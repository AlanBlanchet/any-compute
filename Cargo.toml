[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/ai",
    "crates/dom",
    "crates/bench",
    "crates/ffi",
    "crates/js",
    "examples/dom",
    "examples/showcase",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal crates
any-compute-core = { path = "crates/core" }
any-compute-dom = { path = "crates/dom", default-features = false }
any-compute-bench = { path = "crates/bench" }
any-compute-ffi = { path = "crates/ffi" }
any-compute-js = { path = "crates/js" }

# Shared deps — pinned once, inherited everywhere
thiserror = "2"
smallvec = { version = "1", features = ["union", "const_generics"] }
bumpalo = { version = "3", features = ["collections"] }
parking_lot = "0.12"
rayon = "1"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num_cpus = "1"
sysinfo = "0.35"
humansize = "2"
wgpu = "24"
naga = { version = "24", features = [
    "wgsl-in",
    "glsl-in",
    "spv-in",
    "spv-out",
    "glsl-out",
    "wgsl-out",
] }
winit = "0.29"
pollster = "0.3"
glyphon = "0.8"
png = "0.17"
ureq = "3"
base64 = "0.22"

# Debug builds: opt-level=1 keeps the app interactive while preserving debuginfo.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
